# Zelly POS — statik tahlil sozlamalari.
#
# Maqsad: `flutter analyze` toza turishi va yangi kod eski xatolarni
# takrorlamasligi. Qoidalar bosqichma-bosqich qattiqlashtirilgan —
# tuzatilgan muammo qaytib kelmasligi uchun uning linti `error` darajasiga
# ko'tariladi.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # ── Qaytib kelmasligi kerak bo'lgan muammolar ────────────────────────
    # Loyihada AppLogger bor; print() endi ishlatilmaydi.
    avoid_print: error
    # Bazaga yoziladigan enum nomlari va konstantalar.
    constant_identifier_names: error
    # O'lik kod va foydalanilmagan e'lonlar — xato deb qaraladi.
    dead_code: error
    unused_element: error
    unused_local_variable: error
    unused_import: error
    unused_field: error

    # ── Ko'rinib turishi kerak, lekin hali qolgan qarz ───────────────────
    # cart_provider.dart hali BuildContext'ni async metodlarga uzatadi.
    # To'g'ri yechim — provider'dan BuildContext'ni butunlay olib tashlash
    # (docs/04_ROADMAP.md, Bosqich 4). Shu vaqtgacha warning bo'lib turadi.
    use_build_context_synchronously: warning
    deprecated_member_use: warning

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**

linter:
  rules:
    # Xavfsizlik / to'g'rilik
    - avoid_empty_else
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally

    # Izchillik
    - always_declare_return_types
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unnecessary_parenthesis
    - use_super_parameters

  # ── Hali yoqilmagan qoidalar (keyingi sifat bosqichi) ──────────────────
  # Quyidagilar yoqilsa hozir shuncha ogohlantirish chiqadi. Ularni yoqishdan
  # oldin har birini alohida ko'rib chiqish kerak — aks holda `flutter analyze`
  # shovqinga to'lib, hech kim o'qimay qo'yadi:
  #   avoid_dynamic_calls   (~100) — Map<String, dynamic> ustidagi chaqiruvlar;
  #                                  modellarni tiplashtirish bilan hal bo'ladi
  #   unawaited_futures     (~36)  — har biri "ataylab kutilmayapti"mi yoki
  #                                  unutilganmi — qo'lda tekshirish kerak
  #   avoid_slow_async_io   (~14)  — AppLogger'da ataylab async I/O ishlatiladi
